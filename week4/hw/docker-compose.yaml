services:
  postgresql:
    restart: always
    image: postgres:16
    container_name: postgresql
    ports:
      - "5432:5432"
    networks:
      - vbo
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Ankara06
      - POSTGRES_DB=workshop
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
    postgres_data:
networks:
  vbo: