services:
  spark:
    container_name: spark
    image: veribilimiokulu/pyspark:4.1.3_python-3.12_java21
    build: ./image          # docker compose build spark: builds the image from image/Dockerfile
    ports:
      - "8888:8888"
      - "4041:4040"
    networks:
      - vbo
    volumes:
      - ./spark/examples:/opt/examples
    command:
        - /bin/bash
        - -c
        - |
          apt update && \
          apt install openssh-server sudo sshpass -y && \
          useradd -rm -d /home/ssh_train -s /bin/bash -g root -G sudo -u 1000 ssh_train && \
          echo 'ssh_train:Ankara06' | chpasswd && \
          service ssh start && \
          chown -R ssh_train:users /opt/examples
          tail -f /dev/null
  # S3 compatible object storage: RustFS
  rustfs:
    restart: always
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
        - "9000:9000"
        - "9001:9001"
    networks:
      - vbo
    environment:
        - RUSTFS_ACCESS_KEY=dataops
        - RUSTFS_SECRET_KEY=Ankara06
        - RUSTFS_VOLUMES=/data
        - RUSTFS_ADDRESS=:9000
    volumes:
        - rustfs_data:/data
  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      # Two data listeners: INTERNAL for other containers on the `vbo` network,
      # HOST for clients on the docker host (via the 9092:9092 port publish).
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - vbo
    volumes:
      - kafka_datagen:/var/lib/kafka/data
  postgresql:
    restart: always
    image: postgres:17
    container_name: postgresql
    ports:
      - "5432:5432"
    networks:
      - vbo
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Ankara06
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # Iceberg REST catalog (Apache Polaris).
  # The catalog stores, for every Iceberg table, a pointer to its current metadata file.
  # Polaris keeps that state in PostgreSQL (schema polaris_schema); table files live in RustFS.
  # Spark / Trino / PyIceberg connect to http://polaris:8181/api/catalog with root / s3cr3t.
  polaris-db-init:
    # one-time setup: Polaris needs the schema polaris_schema but does not create it itself
    image: postgres:17
    container_name: polaris-db-init
    networks:
      - vbo
    depends_on:
      - postgresql
    environment:
      PGPASSWORD: Ankara06
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until pg_isready -h postgresql -U postgres; do sleep 1; done
        psql -h postgresql -U postgres -c "CREATE SCHEMA IF NOT EXISTS polaris_schema"
  polaris-bootstrap:
    # one-time setup: creates the Polaris tables in PostgreSQL and the root user
    image: apache/polaris-admin-tool:1.8.0
    container_name: polaris-bootstrap
    networks:
      - vbo
    depends_on:
      polaris-db-init:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgresql:5432/postgres
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: Ankara06
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,root,s3cr3t"]
  polaris:
    restart: always
    image: apache/polaris:1.8.0
    container_name: polaris
    ports:
      - "8181:8181"   # Iceberg REST catalog + management API
      - "8182:8182"   # health check
    networks:
      - vbo
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgresql:5432/postgres
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: Ankara06
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # Polaris writes table metadata to RustFS with these keys
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: dataops
      AWS_SECRET_ACCESS_KEY: Ankara06
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
  polaris-setup:
    # one-time setup: creates the "warehouse" bucket and the "lakehouse" catalog. Safe to re-run.
    image: alpine/curl:8.22.0
    container_name: polaris-setup
    networks:
      - vbo
    depends_on:
      polaris:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "bucket warehouse:"
        curl -s -o /dev/null -w "%{http_code}\n" -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" \
          --user dataops:Ankara06 http://rustfs:9000/warehouse
        TOKEN=$$(curl -sf http://polaris:8181/api/catalog/v1/oauth/tokens --user root:s3cr3t \
          -d grant_type=client_credentials -d scope=PRINCIPAL_ROLE:ALL | sed 's/.*"access_token":"\([^"]*\)".*/\1/')
        echo "catalog lakehouse:"
        curl -s -o /dev/null -w "%{http_code}\n" -X POST http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" -d '{
            "catalog": {
              "name": "lakehouse", "type": "INTERNAL",
              "properties": {"default-base-location": "s3://warehouse"},
              "storageConfigInfo": {
                "storageType": "S3", "allowedLocations": ["s3://warehouse"],
                "endpoint": "http://rustfs:9000", "pathStyleAccess": true,
                "region": "us-east-1", "stsUnavailable": true
              }
            }
          }'
        echo "grant CATALOG_MANAGE_CONTENT to catalog_admin:"
        curl -s -o /dev/null -w "%{http_code}\n" -X PUT \
          http://polaris:8181/api/management/v1/catalogs/lakehouse/catalog-roles/catalog_admin/grants \
          -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" \
          -d '{"type": "catalog", "privilege": "CATALOG_MANAGE_CONTENT"}'
volumes:
  postgres_data:
  kafka_datagen:
  rustfs_data:

networks:
  vbo: